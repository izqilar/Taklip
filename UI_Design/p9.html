<script>
/* ══════════ 应用逻辑 ══════════ */
const $=s=>document.querySelector(s);
let VIEW='console', PAGE='dashboard', RO=false;
/* 对象视角：CUR 表示当前正在查看的具体代理商/服务商（仅总台管理员在代理/服务商视角下使用） */
let CUR={type:'agent',obj:null};
const num=x=>(x||0).toLocaleString('en-US');
function objSource(){return CUR.type==='agent'?AGENTS:CUR.type==='provider'?PROVIDERS:USERS;}
function objTagName(){return CUR.type==='agent'?'代理商':CUR.type==='provider'?'服务商':'用户';}
function isViewAs(){return VIEW==='agent'||VIEW==='provider'||VIEW==='user';}

/* ── 单元格渲染：以 #tag 开头 → 状态标签 ── */
const TAGMAP={ok:'ok',warn:'warn',bad:'bad',mut:'mut',ac:'ac'};
function cell(c){
  if(typeof c==='string'&&c[0]==='#'){const i=c.indexOf(' ');const tag=c.slice(1,i);const txt=c.slice(i+1);
    return `<span class="tag ${TAGMAP[tag]||'mut'}">${txt}</span>`;}
  return c;
}

/* ── 服务类型字典渲染：入驻/业务申请复选框统一从 SVC_DICT 取值 ── */
function renderSvcScopes(){
  const defOn=['SVC-01','SVC-05'];
  [['papScopes','papScope'],['ffScopes','ffScope'],['upScopes','upScope']].forEach(pair=>{
    const box=document.getElementById(pair[0]);if(!box)return;
    box.innerHTML=SVC_DICT.filter(x=>x.status==='启用').map(x=>{
      const on=defOn.indexOf(x.code)>=0?' checked':'';
      return `<label><input type="checkbox" name="${pair[1]}" value="${x.name}"${on}>${x.name}</label>`;
    }).join('');
  });
}

/* ── 服务类型字典渲染：入驻/业务申请复选框统一从 SVC_DICT 取值 ── */
function renderSvcScopes(){
  const defOn=['SVC-01','SVC-05'];
  [['papScopes','papScope'],['ffScopes','ffScope'],['upScopes','upScope']].forEach(pair=>{
    const box=document.getElementById(pair[0]);if(!box)return;
    box.innerHTML=SVC_DICT.filter(x=>x.status==='启用').map(x=>{
      const on=defOn.indexOf(x.code)>=0?' checked':'';
      return `<label><input type="checkbox" name="${pair[1]}" value="${x.name}"${on}>${x.name}</label>`;
    }).join('');
  });
}

/* ── 侧栏导航 ── */
function renderNav(){
  const nav=$('#nav');let h='';
  MENU[VIEW].forEach(g=>{
    if(g.g)h+=`<div class="grp">${g.g}</div>`;
    g.items.forEach(it=>{
      if(it.group){
        const collapsed=it.collapsed?'collapsed':'';
        h+=`<div class="subgrp ${collapsed}" data-sg="${it.group}">
          <div class="subgrp-h">${ic(it.i)}<span>${it.group}</span><span class="sg-arrow">▾</span></div>
          <div class="subgrp-items">`;
        it.items.forEach(sub=>{
          h+=`<div class="mi ${sub.id===PAGE?'on':''}" data-p="${sub.id}">${ic(sub.i)}
            <span class="lbl">${sub.l}</span>${sub.badge?`<span class="bdg">${sub.badge}</span>`:''}</div>`;
        });
        h+=`</div></div>`;
      }else{
        h+=`<div class="mi ${it.id===PAGE?'on':''}" data-p="${it.id}">${ic(it.i)}
          <span class="lbl">${it.l}</span>${it.badge?`<span class="bdg">${it.badge}</span>`:''}</div>`;
      }
    });
  });
  nav.innerHTML=h;
  nav.querySelectorAll('.mi').forEach(el=>el.onclick=()=>goPage(el.dataset.p));
  nav.querySelectorAll('.subgrp-h').forEach(el=>el.onclick=()=>{
    el.parentElement.classList.toggle('collapsed');
  });
}

/* ── 列表页渲染 ── */
let LIST_FILTER=0, LIST_KEY='';
function renderList(key){
  const p=PAGES[key];if(!p){renderNav();return;}
  $('#listTitle').textContent=p.t;
  $('#listSub').textContent=p.s;
  $('#listChip').textContent=p.chip;
  // 行级过滤：fcol 分类标签 + 搜索关键词（保留原始行索引）
  let list=p.r.map((r,i)=>({r,i,idx:i}));
  if(p.fcol!==undefined&&LIST_FILTER>0){
    const fc=p.f[LIST_FILTER].fcol!==undefined?p.f[LIST_FILTER].fcol:p.fcol;
    const fv=p.f[LIST_FILTER].v||p.f[LIST_FILTER].t;
    list=list.filter(x=>{const t=String(x.r[fc]);return Array.isArray(fv)?fv.some(v=>t.indexOf(v)>=0):t.indexOf(fv)>=0;});
  }
  if(LIST_KEY)list=list.filter(x=>x.r.some(v=>String(v).indexOf(LIST_KEY)>=0));
  const f=$('#listFilters');f.innerHTML='';
  p.f.forEach((c,i)=>{
    const el=document.createElement(p.fcol!==undefined?'button':'span');
    el.className='chip'+(i===LIST_FILTER?' on':'');
    el.textContent=c.t+(c.n?` ${c.n}`:'');
    if(p.fcol!==undefined)el.onclick=()=>{LIST_FILTER=(i===LIST_FILTER?0:i);renderList(key);};
    f.appendChild(el);});
  let th='';p.h.forEach(c=>th+=`<th class="${c.n?'n':''}">${c.t}</th>`);
  if(p.acts)th+='<th>操作</th>';
  let tr='';
  list.forEach((x,i)=>{const r=x.r;
    let tds='';p.h.forEach((c,j)=>{tds+=`<td class="${c.n?'n':''}">${cell(r[j])}</td>`;});
    if(p.acts){
      const mm=MODAL_META[key]||{};
      const roCls=RO?' data-ro':'';
      if(p.acts==='review'){
        tds+=`<td><div class="acts"><span class="l" data-a="view" data-i="${x.idx}">查看</span><span class="l ok" data-a="ok" data-i="${x.idx}"${roCls}>通过</span><span class="l bad" data-a="no" data-i="${x.idx}"${roCls}>驳回</span></div></td>`;
      }else if(p.acts==='approve'){
        tds+=`<td><div class="acts"><span class="l" data-a="view" data-i="${x.idx}">查看</span><span class="l dim" data-a="edit" data-i="${x.idx}"${roCls}>审批</span></div></td>`;
      }else if(p.acts==='audit'){
        tds+=`<td><div class="acts"><span class="l" data-a="view" data-i="${x.idx}">查看</span><span class="l dim" data-a="edit" data-i="${x.idx}"${roCls}>审核</span></div></td>`;
      }else if(p.acts==='notice'){
        const st=String(r[p.fcol]||'');
        const needFill=st.indexOf('初审通过')>=0;
        const kind=r[1]&&String(r[1]).indexOf('代理商')>=0?'agent':(r[1]&&String(r[1]).indexOf('业务升级')>=0?'upgrade':'provider');
        tds+=`<td><div class="acts"><span class="l" data-a="view" data-i="${x.idx}">查看</span>${needFill?`<span class="l ok" data-a="fill" data-i="${x.idx}" data-k="${kind}">填写资料</span>`:''}</div></td>`;
      }else if(p.acts==='fbchain'){
        tds+=`<td><div class="acts"><span class="l" data-a="view" data-i="${x.idx}">查看</span><span class="l dim" data-a="edit" data-i="${x.idx}"${roCls}>回应</span><span class="l ok" data-a="up" data-i="${x.idx}"${roCls}>升级代理商</span></div></td>`;
      }else if(p.acts==='fbchain2'){
        tds+=`<td><div class="acts"><span class="l" data-a="view" data-i="${x.idx}">查看</span><span class="l dim" data-a="edit" data-i="${x.idx}"${roCls}>处理</span><span class="l ok" data-a="up" data-i="${x.idx}"${roCls}>升级平台</span></div></td>`;
      }else if(p.acts==='handle'){
        const st=String((mm.fbSt&&mm.fbSt(x.r))||'');
        const done=!/(\u5f85|\u5904\u7406\u4e2d|\u7533\u8bc9\u4e2d)/.test(st);
        const lbl=done?'查看':'处理';
        tds+=`<td><div class="acts"><span class="l ${done?'':'ok'}" data-a="view" data-i="${x.idx}">${lbl}</span></div></td>`;
      }else if(p.acts==='ueval'){
        const evCol=p.evalCol!==undefined?p.evalCol:4;
        const mkCol=p.evalMarkCol!==undefined?p.evalMarkCol:evCol;
        const est=String(x.r[evCol]||'');
        const marked=String(x.r[mkCol]||'').indexOf('已评价')>=0||est.indexOf('已评价')>=0;
        const showEv=!(p.evalOnlyDone&&est.indexOf('已完成')<0&&!marked);
        const evLbl=marked?'追评':'评价';
        tds+=`<td><div class="acts"><span class="l" data-a="view" data-i="${x.idx}">查看</span>${showEv?`<span class="l ok" data-a="eval" data-i="${x.idx}">${evLbl}</span>`:''}</div></td>`;
      }else if(p.acts==='pord'){
        const st0=String(x.r[p.fcol]||'');
        const ev0=String(x.r[6]||'');
        let pnm,pcls='ok';
        if(ev0.indexOf('已评价')>=0){pnm='已评价';pcls='dim';}
        else if(st0.indexOf('待接单')>=0)pnm='处理';
        else if(st0.indexOf('履约中')>=0)pnm='维护';
        else if(st0.indexOf('已完成')>=0)pnm='评价';
        else pnm='处理';
        tds+=`<td><div class="acts"><span class="l" data-a="view" data-i="${x.idx}">查看</span><span class="l ${pcls}" data-a="proc" data-i="${x.idx}"${roCls}${pcls==='dim'?' style="pointer-events:none;opacity:.55"':''}>${pnm}</span></div></td>`;
      }else if(p.acts==='ro'||mm.viewOnly){
        tds+=`<td><div class="acts"><span class="l" data-a="view" data-i="${x.idx}">查看</span></div></td>`;
      }else if(p.acts==='cfg'){
        tds+=`<td><div class="acts"><span class="l dim" data-a="edit" data-i="${x.idx}"${roCls}>编辑</span></div></td>`;
      }else{
        tds+=`<td><div class="acts"><span class="l" data-a="view" data-i="${x.idx}">查看</span><span class="l dim" data-a="edit" data-i="${x.idx}"${roCls}>${mm.btn||'编辑'}</span></div></td>`;
      }
    }
    tr+=`<tr>${tds}</tr>`;});
  $('#listTable').innerHTML=`<thead><tr>${th}</tr></thead><tbody>${tr}</tbody>`;
  $('#listTotal').textContent=list.length;
  $('#listPanelHead').innerHTML=`<span>${p.t}</span><span class="hint">共 <b>${list.length}</b> 条 · 数据隔离由后端强制</span>`;
  const ne=$('#listNew');ne.style.display=p.new?'inline-flex':'none';ne.textContent=p.newLabel||'＋ 新建';
  // 行内操作
  $('#listTable').querySelectorAll('[data-a]').forEach(el=>{
    el.onclick=()=>{
      if(RO&&(el.dataset.a==='ok'||el.dataset.a==='no'||el.dataset.a==='edit'||el.dataset.a==='up'))return;
      const i=+el.dataset.i,a=el.dataset.a;
      if(a==='ok')openModal(key,i,'ok');
      else if(a==='no')openModal(key,i,'no');
      else if(a==='edit')openModal(key,i,'edit');
      else if(a==='fill'){openFillPage(el.dataset.k,key);}
      else if(a==='up'){fbUpgrade(key,i);}
      else if(a==='eval'){openEvalModal(key,i);}
      else if(a==='proc'){openProcModal(key,i);}
      else if(a==='view'&&MODAL_META[key]&&MODAL_META[key].viewPage)openFbDetail(key,i);
      else openModal(key,i,'view');
    };
  });
  $('#listNew').onclick=()=>{const nm=MODAL_META[key]||{};if(nm.newPage)openFbNew(key);else openModal(key,0,'new');};
}

/* ── 资料填写页（通知公告 · 初审通过 → 填写资料） ── */
let FILL_BACK='p-notices';
function openFillPage(kind,backId){
  FILL_BACK=backId||(VIEW==='user'?'u-notices':'p-notices');
  const info=kind==='agent'
    ?{title:'代理商入驻资料填写',sub:'初审已通过 · 补充完整资料后进入管理总台终审'}
    :kind==='upgrade'
    ?{title:'业务升级资料填写',sub:'初审已通过 · 补充升级资料后进入管理总台审核'}
    :{title:'服务商入驻资料填写',sub:'初审已通过 · 补充完整资料后进入管理总台终审'};
  $('#fillTitle').textContent=info.title;
  $('#fillSub').textContent=info.sub;
  $('#ffType').value=kind==='agent'?'代理商':'服务商';
  const meta=VIEWMETA[VIEW];
  $('#crumbView').textContent=meta.crumb;
  $('#crumbPage').textContent=info.title;
  document.querySelectorAll('.page').forEach(s=>s.classList.remove('on'));
  $('#pg-fill').classList.add('on');
}
function bindFillActions(){
  const b=$('#fillBack');if(b)b.onclick=()=>goPage(FILL_BACK);
  const s=$('#ffSave');if(s)s.onclick=()=>alert('草稿已保存，可在通知公告中继续补充');
  const sb=$('#ffSubmit');if(sb)sb.onclick=()=>{
    const name=$('#ffName').value.trim(),phone=$('#ffPhone').value.trim(),cert=$('#ffCert').value.trim(),exp=$('#ffExpire').value;
    if(!name){alert('请填写申请方名称');return;}
    if(!phone||!/^1\d{10}$/.test(phone)){alert('请填写正确的 11 位手机号');return;}
    if(!cert){alert('请填写证件编号');return;}
    if(!exp&&!$('#ffLong').checked){alert('请选择有效期或勾选长期有效');return;}
    const type=$('#ffType').value==='代理商'?'代理商':'服务商';
    alert('资料已提交（'+type+'）\n\n申请资料已进入终审队列，可在「通知公告」关注审核结果。');
    goPage(FILL_BACK);
  };
}
bindFillActions();

/* ── 反馈详情页（我的反馈 · 查看跳页面 + 发送消息） ── */
let FB_VIEW=null,FB_EXTRA=[];
function openFbDetail(key,i){
  const p=PAGES[key];if(!p)return;
  FB_VIEW={key,i};FB_EXTRA=[];
  const mm=MODAL_META[key]||{};
  const r=p.r[i]||[];
  const meta=VIEWMETA[VIEW];
  $('#crumbView').textContent=meta.crumb;
  $('#crumbPage').textContent='反馈详情';
  document.querySelectorAll('.page').forEach(s=>s.classList.remove('on'));
  $('#pg-fbdetail').classList.add('on');
  $('#fbdBody').innerHTML=renderFeedbackLayout(mm,r)+fbUpgradeBar(mm,r)+fbSendArea(VIEW==='console'?'平台':VIEW==='agent'?'代理商':VIEW==='provider'?'服务商':'我');
  bindFbSend();
  const up=document.getElementById('fbdUp');
  if(up)up.onclick=()=>{fbUpgrade(key,FB_VIEW.i);openFbDetail(key,FB_VIEW.i);};
  const bk=document.getElementById('fbdBack');
  const backName=(p&&p.t)||'列表';
  if(bk)bk.textContent='← 返回 '+backName;
  requestAnimationFrame(alignExit);
}
function fbUpgradeBar(mm,r){
  const key=FB_VIEW?FB_VIEW.key:null;
  if(key!=='p-complaints'&&key!=='a-complaints')return '';
  const st=(mm&&mm.fbSt&&mm.fbSt(r))||'';
  const done=!/(\u5f85|\u5904\u7406\u4e2d|\u7533\u8bc9\u4e2d)/.test(String(st));
  if(done)return '';
  const isP=key==='p-complaints';
  return `<div style="border-top:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px">
    <span style="color:var(--ink-3);font-size:12px;flex:1">${isP?'服务商无法解决时，可升级至辖区代理商处理':'代理商无法解决时，可升级至平台仲裁处理'}</span>
    <button class="btn ok" id="fbdUp">${isP?'升级代理商':'升级平台'}</button>
  </div>`;
}
function fbSendArea(op){
  op=op||'我';
  return `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
    <div style="font-weight:600;font-size:13px;margin-bottom:8px">发送消息<span style="color:var(--ink-3);font-weight:400;font-size:11.5px">（补充反馈内容 / 对处理结果的追评）</span></div>
    <div style="display:flex;gap:10px;align-items:flex-end">
      <textarea class="field" id="fbdMsg" rows="2" style="flex:1" placeholder="请输入要发送给责任方的消息内容…"></textarea>
      <button class="btn primary" id="fbdSend" data-op="${op}" style="white-space:nowrap">发送</button>
    </div>
  </div>`;
}
function bindFbSend(){
  const s=$('#fbdSend');if(!s)return;
  s.onclick=()=>{
    const msg=$('#fbdMsg').value.trim();
    if(!msg){alert('请输入消息内容');$('#fbdMsg').focus();return;}
    FB_EXTRA.unshift({op:s.dataset.op||'我',time:'刚刚',content:msg});
    const mm=MODAL_META[FB_VIEW.key]||{},r=PAGES[FB_VIEW.key].r[FB_VIEW.i]||[];
    $('#fbdBody').innerHTML=renderFeedbackLayout(mm,r)+fbSendArea();
    bindFbSend();
    alert('消息已发送，责任方将收到提醒，可继续关注处理进度。');
  };
}
(function(){const b=document.getElementById('fbdBack');if(b)b.onclick=()=>{if(FB_VIEW)goPage(FB_VIEW.key);};})();

/* ── 新增反馈页（我的反馈 · ＋新增反馈） ── */
function openFbNew(key){
  const meta=VIEWMETA[VIEW];
  $('#crumbView').textContent=meta.crumb;
  $('#crumbPage').textContent='新增反馈';
  document.querySelectorAll('.page').forEach(s=>s.classList.remove('on'));
  $('#pg-fbnew').classList.add('on');
  const t1=$('#fbnTitle');if(t1)t1.value='';
  const c1=$('#fbnContent');if(c1)c1.value='';
  const t2=$('#fbnType');if(t2)t2.selectedIndex=0;
  const d1=$('#fbnDept');if(d1)d1.selectedIndex=0;
  const t3=$('#fbnTarget');if(t3)t3.selectedIndex=0;
  const b=document.getElementById('fbnBack');if(b){b.textContent='← 返回 '+(key==='user-feedback'?'用户反馈':'我的反馈');b.onclick=()=>goPage(key);}
  const sv=document.getElementById('fbnSave');if(sv)sv.onclick=()=>alert('草稿已保存，可在「我的反馈」中继续补充');
  const sb=document.getElementById('fbnSubmit');if(sb)sb.onclick=()=>{
    const title=$('#fbnTitle').value.trim(),type=$('#fbnType').value,target=$('#fbnTarget').value,content=$('#fbnContent').value.trim();
    if(!title){alert('请填写反馈主题');return;}
    if(!content){alert('请填写反馈内容');return;}
    const d=new Date(),now=String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    const dept=$('#fbnDept')?$('#fbnDept').value:'服务商负责人';
    FB_NEW_ROWS.unshift(['FB-'+FB_SEQ++,title,type,target,now,'#warn 待回复',dept]);
    const fno='FB-'+FB_SEQ;FB_SEQ++;
    const un=VIEW==='console'?'平台':(CUR.obj?CUR.obj.name:'买买提·艾山');
    if(dept==='服务商负责人'){const pp=PAGES['p-complaints'];if(pp)pp.r.unshift([fno,'用户反馈','用户 '+un,'#warn 待回应',now]);}
    else if(dept==='代理商'){const pa=PAGES['a-complaints'];if(pa)pa.r.unshift([fno,'用户反馈',un,'（反馈：'+title+'）','#warn 待处理',now]);}
    else{const pc=PAGES['complaints'];if(pc)pc.r.unshift([fno,'用户反馈',un,'（反馈：'+title+'）','#warn 待处理',now]);}
    alert('反馈已提交（'+type+' · '+dept+'）\n\n已进入处理流程：'+dept+'（无法解决时逐级升级），可在「我的反馈」查看处理进度并补充消息。');
    goPage(key);
  };
  requestAnimationFrame(alignExit);
}

/* ── 意见反馈 · 升级规则贯穿（服务商→代理商→平台） ── */
function fbUpgrade(key,i){
  const src=PAGES[key].r[i];
  if(!src)return;
  const d=new Date(),now=String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const no=src[0];
  if(key==='p-complaints'){
    const pa=PAGES['a-complaints'];if(pa)pa.r.unshift([no,'升级处理',src[2],'（反馈升级：'+src[2]+' · 服务商无法解决）','#warn 待处理',now]);
    src[3]='#ac 已升级';
    alert('已升级至辖区代理商处理；若代理商仍无法解决，将升级至平台仲裁。');
  }else if(key==='a-complaints'){
    const pc=PAGES['complaints'];if(pc)pc.r.unshift([no,'升级处理',src[2],'（反馈升级：'+src[2]+' · 代理商无法解决）','#warn 待处理',now]);
    src[4]='#ac 已升级';
    alert('已升级至平台仲裁处理。');
  }
  renderList(key);
}

/* ── 入驻弹窗 · 三级区域联动 ── */
const REGION_DATA={
 '新疆维吾尔自治区':{
  '乌鲁木齐市':['天山区','沙依巴克区','新市区','水磨沟区','头屯河区'],

  $('#accMeta').textContent=cfg.hero.meta;
  const sec=$('#accSections');
  sec.innerHTML=cfg.sections.map((s,si)=>{
    const fields=s.fields.map((f,fi)=>{
      let val;
      if(ACC_EDIT && f.edit){
        const dn=`acc-f-${si}-${fi}`;
        if(f.edit==='select'){
          val=`<select class="field acc-input" data-si="${si}" data-fi="${fi}">${(f.options||[]).map(o=>`<option ${o===f.v?'selected':''}>${o}</option>`).join('')}</select>`;
        }else{
          val=`<input class="field acc-input" type="text" value="${f.v}" data-si="${si}" data-fi="${fi}">`;
        }
      }else{
        val=f.tag?`<span class="tag ${f.tag}">${f.v}</span>`:f.v;
      }
      return `<div class="pfield"><label>${f.l}${f.req?'<span class="req">*</span>':''}</label><div class="val ${f.mut?'mut':''} ${f.num?'num':''}">${val}</div></div>`;
    }).join('');
    const perms=s.perms?`<div class="perm-tags">${s.perms.map(p=>`<span class="pt">${p}</span>`).join('')}</div>`:'';
    return `<div class="panel"><header>${s.title}<span class="hint">${s.hint}</span></header><div class="profile-grid">${fields}</div>${perms}</div>`;
  }).join('');
  $('#accEdit').textContent=ACC_EDIT?'保存':'编辑';
  $('#accCancel').style.display=ACC_EDIT?'inline-flex':'none';
}

/* ── 页面切换 ── */
function goPage(id){
  PAGE=id;
  LIST_FILTER=0;LIST_KEY='';
  const lsi=$('#listSearch');if(lsi){lsi.value='';syncListSearch();}
  renderNav();
  const meta=VIEWMETA[VIEW];
  const home=id==='dashboard';
  $('#crumbView').textContent=meta.crumb;
  $('#crumbPage').textContent=home?viewHomeTitle():pageTitle(id);
  document.querySelectorAll('.page').forEach(s=>s.classList.remove('on'));
  if(home){$(`#pg-${VIEW}-home`).classList.add('on');}
  else{
    const staticPg=document.getElementById('pg-'+id);
    if(staticPg){staticPg.classList.add('on');if(id==='account')renderAccount();else if(id==='u-works')renderUserWorks();}
    else{
      if(VIEW==='user'){const um=userListMeta(id);if(um)PAGES[id]=um;}
      else if(VIEW==='console'&&id==='user-feedback'){PAGES[id]=consoleFeedbackMeta();}
      $('#pg-list').classList.add('on');renderList(id);
    }
  }
  requestAnimationFrame(alignExit);
}
function viewHomeTitle(){return VIEW==='console'?'经营总览':VIEW==='agent'?'辖区经营概览':VIEW==='provider'?'我的工作台':'用户工作台';}
function pageTitle(id){
  const p=PAGES[id];if(p)return p.t;
  const it=MENU[VIEW].flatMap(g=>g.items).find(x=>x.id===id);return it?it.l:id;
}

  if(v==='agent'||v==='provider'||v==='user'){
    const src=v==='agent'?AGENTS:v==='provider'?PROVIDERS:USERS;
    CUR={type:v==='agent'?'agent':v==='provider'?'provider':'user',obj:src[0]};
    renderScope();
  }
  document.querySelectorAll('#viewswitch button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  goPage('dashboard');
  syncObjUI();
  renderAccPanel();
  renderTopActs();
}
$('#viewswitch').addEventListener('click',e=>{const b=e.target.closest('button');if(b)switchView(b.dataset.view);});

/* ── 顶部升格入口：用户→代理商/服务商，服务商→代理商 ── */
const UP_SUBMITTED={agent:false,provider:false};
let CUR_UP_ROLE='agent';
function renderTopActs(){
  const c=$('#topActs'); if(!c)return;
  const acts=VIEW==='user'?[['agent','成为代理商'],['provider','成为服务商']]
            :VIEW==='provider'?[['agent','成为代理商']]:[];
  c.innerHTML=acts.map(([r,l])=>{
    const done=UP_SUBMITTED[r];
    return `<button class="btn" data-up="${r}"${done?' disabled':''}>${done?'已提交 · 审核中':l}</button>`;
  }).join('');
  c.querySelectorAll('[data-up]').forEach(b=>{if(!b.disabled)b.onclick=()=>{CUR_UP_ROLE=b.dataset.up;openUpModal(b.dataset.up);};});
}
function openUpModal(role){
  if(RO){alert('当前为运维管理员（只读）视角，操作已锁定；如需代操作请切换为超级管理员。');return;}
  const info=role==='provider'
    ?{title:'申请成为服务商',desc:'提交入驻申请后，由辖区代理商初审、管理总台终审。审核通过后开通服务商后台，可发布服务并接单履约。',kv:[['申请角色','服务商'],['审核流程','辖区初审 → 总台终审'],['开通权限','服务发布 / 接单履约 / 财务中心']]}
    :{title:'申请成为代理商',desc:'提交入驻申请后，由管理总台审核。审核通过后开通代理商后台，获得辖区经营与招商权限。',kv:[['申请角色','代理商'],['审核流程','总台初审 → 总台终审'],['开通权限','辖区经营 / 招商拓展 / 财务分佣']]};
  $('#upModalTitle').textContent=info.title;
  $('#upModalDesc').textContent=info.desc;
  $('#upModalKv').innerHTML=info.kv.map(p=>`<dt>${p[0]}</dt><dd>${p[1]}</dd>`).join('');
  $('#upReason').value='';
  const isSp=role==='provider';
  $('#upScopeWrap').style.display=isSp?'block':'none';
  $('#upRegionWrap').style.display='block';
  $('#upRegionLabel').innerHTML=isSp?'开展服务区域':'计划代理区域';
  document.querySelectorAll('#upScopes input').forEach(c=>c.checked=false);
  resetUpRegion();
  $('#scrim').classList.add('on');$('#upModal').classList.add('on');
}
function closeUpModal(){$('#scrim').classList.remove('on');$('#upModal').classList.remove('on');}
$('#upModalX').onclick=closeUpModal;
$('#upCancel').onclick=closeUpModal;
$('#upSubmit').onclick=()=>{
  if(RO)return;
  const reason=$('#upReason').value.trim();
  if(!reason){alert('请填写申请理由');$('#upReason').focus();return;}
  const role=CUR_UP_ROLE||'agent';
  let extra='';
  if(!$('#upProv').value||!$('#upCity').value||!$('#upDist').value){
    alert(role==='provider'?'请完整选择开展服务区域（省/市/区县）':'请完整选择计划代理区域（省/市/区县）');return;
  }
  if(role==='provider'){
    const scopes=[...document.querySelectorAll('#upScopes input:checked')].map(c=>c.value);
    if(!scopes.length){alert('请至少选择一项服务类型');return;}
    extra='服务类型：'+scopes.join(' / ')+'，开展区域：'+$('#upProv').value+' / '+$('#upCity').value+' / '+$('#upDist').value+'\n\n';
  }else{
    extra='代理区域：'+$('#upProv').value+' / '+$('#upCity').value+' / '+$('#upDist').value+'\n\n';
  }
  UP_SUBMITTED[role]=true;
  closeUpModal();renderTopActs();
  alert('入驻申请已提交（'+(role==='provider'?'服务商':'代理商')+'）\n\n'+extra+'申请理由：'+reason+'\n\n申请已进入审核队列：'+(role==='provider'?'辖区代理商初审 → 总台终审':'总台审核')+'，可在「消息中心」关注审核进度。');
};

/* ── 四态 ── */
function show(name){
  document.querySelectorAll('.page').forEach(s=>s.classList.remove('on'));
  if(name==='data'){goPage(PAGE);return;}
  $('#pg-states').classList.add('on');
  document.querySelectorAll('[data-state]').forEach(s=>s.classList.toggle('on',s.dataset.state===name));
}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{show(b.dataset.go);});
$('#retryBtn').onclick=()=>show('data');

/* ── 只读 / 可写（决策②：按管理员账号权限） ── */
function setMode(m){
  RO=(m==='ops');
  $('#sideName').textContent=RO?'运维管理员':'超级管理员';
  $('#sideRole').textContent=RO?'总台 · 只读':'总台 · 可写';
  $('#sideAv').textContent=RO?'运':'超';
  $('#roBanner').style.display=RO?'flex':'none';
  // 面板权限模式选中态 + 页头头像
  document.querySelectorAll('.ap-mode').forEach(el=>el.classList.toggle('on',el.dataset.mode===m));
  if(VIEW==='console'){
    const av=RO?'运':'张';
    $('#accAvTop').textContent=av;
    $('#apAvatar').textContent=av;
  }
  if(isViewAs())renderScope();
  if(PAGE!=='dashboard')renderList(PAGE);
}
$('#acc').addEventListener('click',e=>{
  // 权限模式切换
  const modeEl=e.target.closest('.ap-mode');
  if(modeEl){setMode(modeEl.dataset.mode);return;}
  // 快捷入口/待办/工具点击 → 跳转
  const goEl=e.target.closest('[data-go]');
  if(goEl){goPage(goEl.dataset.go);$('#accpanel').classList.remove('on');return;}
  // 退出登录
  if(e.target.closest('#apLogout')){$('#accpanel').classList.remove('on');return;}
  // 复制ID
  if(e.target.closest('.ap-copy')){
    const id=$('#apId').textContent;
    if(navigator.clipboard)navigator.clipboard.writeText(id);
    return;
  }
  // 切换面板
  $('#accpanel').classList.toggle('on');
});
document.addEventListener('click',e=>{if(!e.target.closest('.acc'))$('#accpanel').classList.remove('on');});

function fbTrace(st,dept){
  const done=!/\u5f85|\u5904\u7406\u4e2d|\u7533\u8bc9\u4e2d/.test(String(st));
  const steps=dept==='代理商'
    ?[['提交反馈','已提交至反馈处理中心'],['代理商受理','代理商审核并协调处理'],['平台升级','代理商无法解决时升级至平台']]
    :dept==='平台'
    ?[['提交反馈','已提交至反馈处理中心'],['平台处理','平台直接受理处理']]
    :[['提交反馈','已提交至反馈处理中心'],['服务商负责人受理','服务商核对并响应处理'],['代理商介入','服务商无法解决时升级至代理商'],['平台升级','仍未解决时最终升级至平台']];
  return `<div class="flow" style="margin:0">`+steps.map((s,i)=>{
    const mark=(i<=1)?'ok':(done?'ok':String(i+1));
    return `<div class="fstep"><span class="fnum ${mark==='ok'?'ok':''}">${mark==='ok'?'✓':mark}</span><div><div class="ft">${s[0]}</div><div class="fd">${s[1]}</div></div></div>`;
  }).join('')+`</div>`;
}
function fbThreadTable(mm,r,extra){
  mm=mm||{};
  const fbKey=(mm.fbKey&&mm.fbKey(r))||r[0];
  const t=FB_THREAD[fbKey]||{me:(mm.fbMe&&mm.fbMe(r))||'（反馈内容：'+fbKey+'，详情以提交内容为准）',replies:[]};
  const tm=(mm.fbTime&&mm.fbTime(r))||r[3];
  const firstOp=(mm.fbMe)?(r[2]||'反馈人'):'我（'+tm+'）';
  const all=[{op:firstOp,time:tm,content:t.me}].concat(t.replies.map(rp=>({op:rp[0],time:rp[1],content:rp[2]})));
  const rows=(extra||[]).concat(all.slice().reverse());
  return `<div style="max-height:190px;overflow-y:auto;border-radius:6px">
  <table style="width:100%;table-layout:fixed;border-collapse:collapse;font-size:12.5px">
    <thead><tr style="background:var(--bg);color:var(--ink-3);text-align:left">
      <th style="position:sticky;top:0;background:var(--bg);z-index:1;padding:8px 10px;border:1px solid var(--border);width:132px">操作人</th>
      <th style="position:sticky;top:0;background:var(--bg);z-index:1;padding:8px 10px;border:1px solid var(--border);width:112px">处理时间</th>
      <th style="position:sticky;top:0;background:var(--bg);z-index:1;padding:8px 10px;border:1px solid var(--border);word-break:break-word">回复内容</th>
    </tr></thead>
    <tbody>${rows.map(x=>`<tr>
      <td style="padding:8px 10px;border:1px solid var(--border);color:var(--ink-2);word-break:break-word">${x.op}</td>
      <td style="padding:8px 10px;border:1px solid var(--border);color:var(--ink-3);white-space:nowrap">${x.time}</td>
      <td style="padding:8px 10px;border:1px solid var(--border);line-height:1.6;white-space:normal;word-break:break-word;overflow-wrap:anywhere">${x.content}</td>

}

function buildForm(mm,r){
  const vals=mm.eF(r);
  return mm.eLabels.map((lbl,k)=>{
    const t=(mm.eTypes||[])[k]||'text';
    const opts=((mm.eOpts||{})[k])||[];
    const val=vals[k]===null||vals[k]===undefined?'':vals[k];
    const star=(mm.eReq&&mm.eReq.indexOf(k)>=0)?'<span class="req">*</span>':'';
    if(t==='textarea')return `<div class="fd"><label>${lbl}${star}</label><textarea class="field" data-ef="${k}" rows="2">${val}</textarea></div>`;
    if(t==='select')return `<div class="fd"><label>${lbl}${star}</label><select class="field" data-ef="${k}">${opts.map(o=>`<option${o===val?' selected':''}>${o}</option>`).join('')}</select></div>`;
    if(t==='perm'){
      const cur=Array.isArray(val)?val:[];
      return `<div class="fd"><label>${lbl}${star}</label><div class="perm">${permGroups().map(g=>`<div class="pgrp"><div class="pgt">${g.g}</div>${g.items.map(it=>`<label class="pchk"><input type="checkbox" data-ef="${k}" data-perm="${it}"${cur.indexOf(it)>=0?' checked':''}>${it}</label>`).join('')}</div>`).join('')}</div></div>`;
    }
    return `<div class="fd"><label>${lbl}${star}</label><input class="field" data-ef="${k}" value="${val}"></div>`;
  }).join('');
}

function approveModal(ok){

function saveModal(){
  if(RO)return;
  const p=PAGES[MODAL_KEY],mm=MODAL_META[MODAL_KEY]||{};
  const isNew=MODAL_ACT==='new';
  let r=isNew?null:(p.r[MODAL_I]||[]);
  if(isNew){
    const L=mm.labels?mm.labels.length:(p.h?p.h.length:0);
    r=new Array(Math.max(L,1)).fill('');
    const first=p.r[0]||[];
    if(first[0]&&/^[A-Z]{1,6}-\d+$/.test(String(first[0]))){
      let mx=0;
      p.r.forEach(x=>{const m=String(x[0]||'').match(/^([A-Z]{1,6}-)(\d+)$/);if(m)mx=Math.max(mx,parseInt(m[2],10));});
      r[0]=String(first[0]).replace(/\d+$/,mx+1);
    }
  }
  const statusSel=document.querySelector('#mKv [data-status-edit]');
  if(statusSel&&mm.stCol!==undefined&&r){r[mm.stCol]=statusSel.value;}
  if(mm.inlineEdits&&r){
    mm.inlineEdits.forEach(ie=>{
      const el=document.querySelector(`#mKv [data-inline-edit="${ie.col}"]`);
      if(el)r[ie.col]=el.value;
    });
  }
  const eTypes=mm.eTypes||[];
  (mm.eLabels||[]).forEach((lbl,k)=>{
    const col=(mm.eCols||[])[k];
    if(col===null||col===undefined)return;
    if(eTypes[k]==='perm'){
      r[col]=[...$('#mForm').querySelectorAll(`[data-ef="${k}"]:checked`)].map(c=>c.dataset.perm);
    }else{
      const el=$('#mForm').querySelector(`[data-ef="${k}"]`);
      if(el)r[col]=el.value;
    }
  });
  if(isNew)p.r.push(r);
  closeModal();renderList(MODAL_KEY);
}

function showSingleAttachPreview(name,file){
  const ext=(file||'').split('.').pop().toLowerCase();
  const isImg=['jpg','jpeg','png','gif','webp'].indexOf(ext)>=0;
  const bgGrad=isImg?'linear-gradient(135deg,#e8d5c4,#d4a574)':'linear-gradient(135deg,#d0d0d0,#a0a0a0)';
  const icon=isImg?'\u{1F5BC}':'\u{1F4C4}';
  const ftype=isImg?'图片文件':'文档文件';
  const previewText=isImg?'[ 图片预览区域 ] 实际项目中将在此展示图片原件，支持放大、缩小、旋转、下载':'[ 文档预览区域 ] 实际项目中将在此展示文档内容，支持翻页、缩放、下载';
  const list=$('#attachList');
  var html='<div style="padding:16px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2)">';
  html+='<div style="display:flex;align-items:center;gap:14px;margin-bottom:12px">';
  html+='<div style="width:56px;height:56px;border-radius:8px;background:'+bgGrad+';display:grid;place-items:center;color:#fff;font-size:24px;font-weight:700">'+icon+'</div>';
  html+='<div><div style="font-size:15px;font-weight:700;color:var(--ink-1)">'+name+'</div><div style="font-size:12px;color:var(--ink-3);margin-top:4px">'+file+' · '+ftype+' · 大小约 1.2MB</div></div>';
  html+='</div>';

      <div style="width:48px;height:48px;border-radius:6px;background:${isImg?'linear-gradient(135deg,#e8d5c4,#d4a574)':'linear-gradient(135deg,#d0d0d0,#a0a0a0)'};display:grid;place-items:center;color:#fff;font-size:20px;font-weight:700">${isImg?'🖼':'📄'}</div>

/* ── 返回总台按钮：右缘对齐当前页 pghead 内 sp 之后元素（角色标签）的右缘 ── */
function alignExit(){
  const btn=document.getElementById('objExit');
  if(!btn||btn.offsetParent===null)return;
  const pgs=[...document.querySelectorAll('.page.on .pghead')].filter(e=>e.offsetParent!==null);
  if(!pgs.length)return;
  const sp=pgs[0].querySelector('.sp');
  const ref=(sp&&sp.nextElementSibling)?sp.nextElementSibling:sp;
  if(!ref)return;
  const target=ref.getBoundingClientRect().right;
  const b=btn.getBoundingClientRect().right;
  const cur=parseFloat(getComputedStyle(btn).marginRight)||0;
  const need=Math.round(cur+(b-target));
  if(Math.abs(need-cur)>0.5)btn.style.marginRight=need+'px';
}
window.addEventListener('resize',()=>requestAnimationFrame(alignExit));
$('#objQ').addEventListener('focus',()=>{$('#objList').classList.add('on');renderObjList();});
$('#objQ').addEventListener('input',()=>renderObjList());
$('#objList').addEventListener('click',e=>{

  const o=objSource().find(x=>x.id===b.dataset.id);if(o)setCurObj(o);
  $('#objList').classList.remove('on');
});

  const hits=objSource().filter(o=>[o.id,o.name,o.nick,o.phone,o.region].some(s=>s.includes(q)));
  if(hits.length===1){
    setCurObj(hits[0]);

  }else{

    renderObjList();
  }
};

/* ── 服务商入驻申请页交互 ── */
document.addEventListener('click',e=>{
  const ti=e.target.closest('#papTypes .ti');if(!ti)return;
  document.querySelectorAll('#papTypes .ti').forEach(x=>x.classList.remove('on'));
  ti.classList.add('on');
});
const papLongEl=document.getElementById('papLong');
if(papLongEl)papLongEl.addEventListener('change',function(){
  const d=document.getElementById('papExpire');
  if(d){d.disabled=this.checked;if(this.checked)d.value='';}
});
const papFileEl=document.getElementById('papFile');
if(papFileEl)papFileEl.addEventListener('change',function(){
  if(this.files&&this.files[0]){
    const f=this.files[0];
    const isImg=/\.(jpg|jpeg|png|gif|webp)$/i.test(f.name);
    const size=(f.size/1024/1024).toFixed(1);
    const box=document.createElement('div');
    box.className='upfile';
    box.innerHTML='<span class="ic">'+(isImg?'\u{1F5BC}':'\u{1F4C4}')+'</span><div style="flex:1;min-width:0"><div class="nm">'+f.name+'</div><div class="mt">'+size+' MB · 已上传</div></div><button class="btn" onclick="this.parentElement.remove()">删除</button>';
    document.getElementById('papFiles').appendChild(box);
  }
  this.value='';
});
function submitProviderApply(){
  const name=(document.getElementById('papName').value||'').trim();
  const phone=(document.getElementById('papPhone').value||'').trim();
  if(!name){alert('请填写申请方名称');return;}
  if(!/^1\d{10}$/.test(phone)){alert('请填写正确的11位手机号');return;}
  const scopes=document.querySelectorAll('input[name="papScope"]:checked');
  if(scopes.length===0){alert('请至少选择一项业务范围');return;}
  const cert=(document.getElementById('papCert').value||'').trim();
  const expire=document.getElementById('papExpire').value;
  const long=document.getElementById('papLong')&&document.getElementById('papLong').checked;
  if(!cert){alert('请填写证件编号');return;}
  if(!expire&&!long){alert('请选择有效期至或勾选长期有效');return;}
  const scopeNames=[].map.call(scopes,x=>x.value).join('、');
  alert('业务申请已提交：'+name+'（'+scopeNames+'）\n\n申请已进入审核队列：辖区代理商初审 → 总台终审，可在「消息中心」关注进度。');
  setTimeout(()=>goPage('dashboard'),600);
}
</script>
