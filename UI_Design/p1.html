<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>庆柬云 · 分层管理后台</title>
<style>
/* 一个后端 · 分层治理 · 总台统筹
   庆柬云 B 端控制台：暖石底 + 朱砂主色 + 青副色，网格排版，静默动效
   底色不纯白 / 强调色单角色 / 状态双角色（浅底深字）/ B端靠线不靠阴影 */
:root{
  --page:#f5f2ec;
  --bg:#fffefb;
  --panel-2:#f3eee7;
  --border:rgba(74,60,42,.10);
  --ink-1:#2a2118;
  --ink-2:#4c4236;
  --ink-3:#86765f;
  --accent:#c24b2e;
  --accent-2:#14676b;
  --accent-soft:rgba(194,75,46,.10);
  --accent-2-soft:rgba(20,103,107,.10);
  --on-accent:#fff;
  --up:#1d7a6b;  --up-ink:#0f5a4e;
  --down:#c02b33; --down-ink:#8f1d24;
  --warn:#b77a16; --warn-ink:#7a4d07;
  --bad:#c02b33; --bad-ink:#8f1d24;
  --r-sm:6px;
  --r-md:10px;
  --r-lg:14px;
  --side:240px;
  --row:46px;
  --num:"Bahnschrift","DIN Alternate","Arial",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--ink-1);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-family:var(--num)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;min-height:28px}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
table{border-collapse:collapse;width:100%}
svg{flex:none}
</style>
</head>
